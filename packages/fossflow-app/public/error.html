<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - NIZU Flow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .error-container {
            background-color: #f5c6cb;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-top: 0;
        }

        a {
            color: #721c24;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>NIZU Authentication Error</h1>
        <p>This app can only be loaded inside the NIZU workspace.</p>
    </div>
</body>

</html>
